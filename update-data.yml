name: 데이터 갱신

on:
  schedule:
    - cron: "0 21 * * 0"   # 매주 월요일 오전 6시(KST)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한국도로교통공단 데이터 가져오기
        env:
          KOROAD_KEY: ${{ secrets.KOROAD_KEY }}
        run: python scripts/fetch_data.py
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/accidents.json
          git diff --cached --quiet || (git commit -m "데이터 갱신" && git push)
