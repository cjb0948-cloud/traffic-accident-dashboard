<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교통사고 현황판</title>
  <meta name="description" content="한국도로교통공단 공공데이터로 보는 교통사고 현황판">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

<header class="sign">
  <div>
    <h1>교통사고 현황판</h1>
    <p id="scope">한국도로교통공단 교통사고 통계</p>
  </div>
  <label class="year-pick">기준 연도
    <select id="year" aria-label="기준 연도 선택"></select>
  </label>
</header>

<div id="notice" class="notice" role="status" hidden></div>

<main>
  <div class="filters">
    <label>사고 종류 <select id="cls" aria-label="사고 종류 선택"></select></label>
    <label>지역 <select id="sido" aria-label="지역 선택"></select></label>
    <div class="metric-bar" role="group" aria-label="그래프 기준">
      <button type="button" data-metric="accidents" aria-pressed="true">사고 건수</button>
      <button type="button" data-metric="deaths" aria-pressed="false">사망자</button>
      <button type="button" data-metric="injuries" aria-pressed="false">부상자</button>
    </div>
  </div>

  <section class="kpis" aria-label="핵심 지표">
    <div class="kpi"><span class="kpi-label" id="l-accidents">사고 건수</span><strong id="k-accidents">-</strong><span class="kpi-sub" id="s-accidents"></span></div>
    <div class="kpi death"><span class="kpi-label">사망자</span><strong id="k-deaths">-</strong><span class="kpi-sub" id="s-deaths"></span></div>
    <div class="kpi injury"><span class="kpi-label">부상자</span><strong id="k-injuries">-</strong><span class="kpi-sub" id="s-injuries"></span></div>
    <div class="kpi"><span class="kpi-label">전년 대비 사망자</span><strong id="k-delta">-</strong><span class="kpi-sub" id="s-delta"></span></div>
  </section>

  <div class="grid">
    <section class="panel wide">
      <h2 id="t-trend">연도별 추이</h2>
      <div class="chart h260"><canvas id="c-trend" role="img" aria-label="연도별 추이 그래프"></canvas></div>
    </section>
    <section class="panel">
      <h2 id="t-classes">사고 종류별 비교</h2>
      <div class="chart h460"><canvas id="c-classes" role="img" aria-label="사고 종류별 비교 그래프"></canvas></div>
    </section>
    <section class="panel">
      <h2 id="t-region">시도별</h2>
      <div class="chart h460"><canvas id="c-region" role="img" aria-label="시도별 그래프"></canvas></div>
    </section>
    <section class="panel wide">
      <h2 id="t-top">시군구 순위</h2>
      <div class="chart h460"><canvas id="c-top" role="img" aria-label="시군구 순위 그래프"></canvas></div>
    </section>
  </div>
</main>

<footer>
  <p id="source">출처: 한국도로교통공단, 공공데이터포털(data.go.kr)</p>
  <p id="updated"></p>
</footer>

</body>
</html>
